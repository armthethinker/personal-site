<div class="container-fluid p-0" style="background-image: url(/assets/imgopt/samsung/squiggle-0183.jpg); background-size: cover; background-position: 50% 90%;">
    <div class="container-fluid p-0 shim-brightness-4 shim-gradient-transparent-to-black">
        <div class="container main-header-text-shadow" >
            <div class="pt-3">
                {% include navigation.html %}
            </div>
        </div>
    </div>
</div>


<div class="container-fluid">
    <div class="row justify-content-center py-5">
        <div class="col-8">
            {% for item in site.data.timeline %}
                {% include
                    timeline-entry.html
                    date=item.date
                    emoji=item.emoji
                    description1=item.description1
                    description2=item.description2
                    short=item.short
                    short2=item.short2
                    %}
            {% endfor %}
        </div>
    </div>
</div>
