capture:
- header: Capture a video
  caption: Behind the scenes, Wist captures per-frame depth and camera pose data to reconstruct the 3D memory.
  url: /assets/imgopt/wist/capture2-low.mp4
  type: video
- header: Or import a video
  caption: The source video is uploaded and processed to generate the 3D data.
  url: /assets/imgopt/wist/temp/features/timer.jpg
  type: image

playback:
- header: In headsets
  caption: Relive and walk around the moment on Quest and Vision Pro
  url: /assets/imgopt/wist/temp/throwing-low.mp4
  type: video
- header: And on mobile
  caption: Experience a depth-enhanced 2D-inspired viewer
  url: /assets/imgopt/wist/temp/wist-spatial-scrubbing.MOV
  type: video

enhance:
- header: Source data is flawed or missing
  caption: For example, LiDAR is high quality at low frequencies and near-field, but has low accuracy for high frequency spatial data and far-field.
  url: /assets/imgopt/wist/decks/enhance.jpg
  type: image
- header: Enhance with a constellation of models
  caption: The backend pipeline infers additional data used to resolve and refine the source memory. Users don't need the details, just that it works for them.
  url: /assets/imgopt/wist/temp/importScanLayers.gif
  type: image
- header: Build around unique constraints
  caption: Captures are taken in the wild, may not have all data (e.g. depth, pose). Each ML model and CV technique has limitations. I built a pipeline that blended approaches to yield high quality reconstructions.
  url: /assets/imgopt/wist/temp/rerun/rerun-ba-solve-trimmed-sm.mp4
  type: video

