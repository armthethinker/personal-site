- date: 2009-2013
  emoji: 👨🏻‍💻, 👨🏻‍🌾, 🚴🏻‍♂️
  description1: >
    <strong>In undergrad, I studied four components of human experience</strong>: philosophy, a humanities perspective on technology, math, and physics.
  description2: >
    On the side, I created a startup/conference, <a href="/projects/what-if-conference-book.html">What If…?</a>, that encouraged active curiosity. I also led a sustainability house, led efforts for a campus revolving sustainability fund, and created a campus bike share program.
  short: Undergrad with philosophy, humanities perspective on technology, math, and physics. 
  short2: And built a startup (What If…?), led a sustainability house, and built a campus bike share program.
- date: 2014
  emoji: 👨🏻‍✈️
  description1: <strong>Continued to design and produce <a href="/projects/what-if-conference-book.html">The What If…? Conference</a></strong>, helping 1000s ask their own questions.
  short: Continued to design and produce The What If…? Conference,
  short2: helping 1,000s ask their own questions.
- date: 2015
  emoji: 👨🏻‍🎨
  description1: >
    <strong>Left What If…? to pursue a career in a nascent technology that could use ethical designers</strong>: spatial computing.
  description2: >
    Stint at an agency and as a freelancer, doing UX design and front-end web development. A few shipped products: (1) a home service worker app, (2) a political campaign management app, and (3) a restaurant food temperature app.
  short: Left What If…? to pursue spatial computing as an ethical designer.
  short2: With a stint at an agency and as a freelancer.
- date: 2015-2016
  emoji: 👨🏻‍💻, 🙌🏻, 🏦
  description1: <strong>Dual-degree master's in human-computer interaction at Carnegie Mellon University and the Madeira Interactive Technologies Institute</strong> (a small Portuguese institute off the coast of Morocco).
  description2: Researched how <a href="/projects/moral-decision-making-haptic-feedback-in-virtual-environments.html">haptic feedback can change moral decisions</a> in VR (and it was even <a href="https://www.wsj.com/articles/how-new-technology-is-illuminating-a-classic-ethical-dilemma-1465395082" target="_blank">featured in the Wall Street Journal</a>). Led a team of three for client work to design a <a href="/projects/elementary.html">consumer banking app</a> for the Portuguese market that, honestly, we all need. 
  short: Master's in HCI
  short2: at Carnegie Mellon University and the M-ITI (Portugal). Worked on <a href="/projects/moral-decision-making-haptic-feedback-in-virtual-environments.html">haptics in VR</a> and designed a next-gen <a href="/projects/elementary.html">consumer banking app</a> for a client. <a href="https://www.wsj.com/articles/how-new-technology-is-illuminating-a-classic-ethical-dilemma-1465395082" target="_blank">Coverage in WSJ.</a>
- date: 2016
  emoji: 📕
  description1: >
    <strong>Published a young adult non-fiction book, <a href="https://www.amazon.com/dp/1582705291/" target="_blank">The Book Of What If…?: Questions & Activities for Curious Minds</a></strong>. Published in English, Macedonian, & Chinese.
  short: Published <a href="https://www.amazon.com/Book-What-If-Questions-Activities/dp/1582705283/" target="_blank">The Book Of What If…?</a>
  short2: Questions & Activities for Curious Minds.
