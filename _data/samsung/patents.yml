- title: Mobile device with a foldable display and method of providing user interfaces on the foldable display
  abstract: A system and method for controlling presentation on a foldable display of an electronic device is provided. A foldable electronic device comprises a foldable housing including a hinge structure, a first housing structure and a second housing structure foldable and unfoldable with respect to the first housing structure about the hinge structure. The electronic device includes a processor and a memory to store instructions that cause the processor to receive a first user input to select an application program; detect a change from a folded state to an unfolded state; determine whether the selected application program has user interface size restrictions; and in the unfolded state, display a user interface of the selected application on at least a portion of the foldable display, based in part on the screen size restriction.
  description: Novel interactions to manage multiple open apps/windows, especially for foldable devices.
  img: US20200320906A1-20201008-D00013.jpg
  year: 2019
  inventors: Duncan Knarr, Andrew R McHugh, Seokhyun Yoon
  assignee: Samsung Electronics Co Ltd
  number: US20200320906A1
  link: https://patents.google.com/patent/US20200320906A1/en
  status: Granted
  objectPosition: 50% 89%
  small: true
- title: System and method for head mounted device input
  abstract: According to one implementation, a head mounted display (HMD) device comprises a motion detector, a display, and a processor coupled to the motion detector and the display. A memory is also coupled to the processor, wherein the memory stores executable instructions that cause the processor to define an available range for a motion and output a graphic user interface for the available range on the display. An input based upon a motion of the HMD device detected by the inertial motion unit, within the available range is received. One of the HMD device or an external device may then be controlled in response to the input.
  description: Utilizing head or body movement as a discrete or continuous input. Useful in limited contexts for non-primary input.
  img: US20200202629A1-20200625-D00005.jpg
  year: 2019
  inventors: Priyanka Sharma, Andrew R McHugh
  assignee: Samsung Electronics Co Ltd
  number: US20200202629A1
  link: https://patents.google.com/patent/US20200202629A1/en
  status: Granted
  objectPosition: 0% 0%
  small: true
- title: System and method for transition boundaries and distance responsive interfaces in augmented and virtual reality
  abstract: A head mounted display (HMD) device is provided. The HMD has a display panel, a depth or distance sensor to measure distances between the HMD and a real object. The HMD device sets a close transition boundary distance (CTBD) between the HMD and a close transition boundary (CTB). A far transition boundary distance (FTBD) is set between the HMD and a far transition boundary (FTB). The CTBD is less than the FTBD. As a real object that has associated near and far virtual content moves nearer to the HMD device and crosses the CTB, the virtual content transitions to near virtual content for viewing on the HMD. As the real object moves away from the HMD and crosses the FTB, the virtual content transitions to the far virtual content for viewing on the HMD.
  description: Increased legibility and contextual controls based on user distance from UI. Additional system to prevent rapid toggling when user stands on boundary line.
  img: US20190172262A1-20190606-D00005.jpg
  year: 2018
  inventors: Andrew R McHugh, Duncan Knarr
  assignee: Samsung Electronics Co Ltd
  number: US20190172262A1
  link: https://patents.google.com/patent/US20190172262A1/en
  status: Granted
  objectPosition: 50% 90%
  small: false
- title: Systems and Methods for Manipulating Views and Shared Objects in XR Space
  abstract: In one embodiment, a method includes rendering a first sequence of image frames of an extended reality (XR) video call on touchscreen displays of an electronic device, wherein the first sequence of images portrays a shared XR space, and wherein the XR video call is between a first user of the electronic device and one or more second users, receiving gesture inputs associated with manipulating parameters of the XR space during the XR video call via the touchscreen displays, determining transformations within the XR space responsive to the gesture inputs, wherein the determination is based on a gesture type associated with each of the gesture inputs, and rendering a second sequence of image frames of the XR video call on the touchscreen displays, wherein the second sequence of images portrays the transformations to the XR space.
  description: Interactions around embodied "video calls" in AR, from a system that can support headsets and phones."
  img: US20220229535A1-20220721-D00038.jpg
  year: 2021
  inventors: Edgar Evangelista, Aaron Faucher, Jaehyun Kim, Andrew R McHugh
  assignee: Samsung Electronics Co Ltd
  number: US20220229535A1
  link: https://patents.google.com/patent/US20220229535A1/en
  status: Abandoned
  objectPosition: 50% 50%
  small: false
- title: Extended reality interaction in synchronous virtual spaces using heterogeneous devices
  abstract: Extended reality interactions include capturing, with a first device, video of a first user and conveying same to a second, heterogeneous device. A 3D mesh is received by the first device from the second device for rendering an extended reality environment, which is simultaneously displayed on the second device. Video of a second user and pose transforms for compositing the video of the second user in the extended reality environment displayed on the first device is received. A view perspective of the video of the second user composited in the extended reality environment is based on the pose transforms. Input to the first device changes the view perspective. View perspective data is conveyed from the first device to the second device that causes a corresponding change in view perspective of the video of the first user composited in the extended reality environment simultaneously displayed on the second device.
  description: AR glasses + phones in the same embodied space with minimal user effort.
  img: US11995776-20240528-D00009.jpg
  year: 2021
  inventors: Edgar Evangelista, Aaron Faucher, Jaehyun Kim, Andrew R McHugh
  assignee: Samsung Electronics Co Ltd
  number: US11995776B2
  link: https://patents.google.com/patent/US11995776B2/en
  status: Granted
  objectPosition: 50% 3%
  small: false
- title: System and method for conversation-based notification management
  abstract: A method for dynamic notification management at a head mounted display (HMD) includes presenting, at the HMD, an augmented reality display, receiving, at a processor controlling the HMD, a notification from an application for display at the HMD, receiving, at the processor at a first time, first sensor data from one or more of a camera or a microphone, determining, based on the first sensor data, a first value of one or more factors associated with a probability that a user of the HMD is currently in a real-world conversation, determining an importance value of the received notification at the first time, and determining whether to display the notification from the application based on a comparison of the first value of the one or more factors associated relative to the importance value of the received notification.
  description: Contextually-aware notification management system for AR glasses.
  img: US20220385617A1-20221201-D00004.jpg
  year: 2022
  inventors: Jaehyun Kim, Andrew R McHugh
